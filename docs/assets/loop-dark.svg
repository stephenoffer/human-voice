<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="The human-voice rewrite loop"><title>The human-voice rewrite loop</title>
<rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#151B23" stroke="#262C36"/>
<text x="32" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="start">Every pass has to earn its way out</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198A1"/></marker></defs>
<rect x="26" y="74" width="144" height="78" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/>
<text x="98.0" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF3" text-anchor="middle">Draft</text>
<text x="98.0" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">your text or a brief</text>
<rect x="198" y="74" width="144" height="78" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/>
<text x="270.0" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF3" text-anchor="middle">Lint</text>
<text x="270.0" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">68 checks, shape first</text>
<line x1="173" y1="113" x2="194" y2="113" stroke="#9198A1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="370" y="74" width="144" height="78" rx="12" fill="#8B93FF" stroke="#8B93FF" stroke-width="1.5"/>
<text x="442.0" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0D1117" text-anchor="middle">Rewrite</text>
<text x="442.0" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0D1117" text-anchor="middle">any model, full skill</text>
<line x1="345" y1="113" x2="366" y2="113" stroke="#9198A1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="542" y="74" width="144" height="78" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/>
<text x="614.0" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF3" text-anchor="middle">Check</text>
<text x="614.0" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">score, facts, detector</text>
<line x1="517" y1="113" x2="538" y2="113" stroke="#9198A1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="714" y="74" width="144" height="78" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/>
<text x="786.0" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF3" text-anchor="middle">Ship</text>
<text x="786.0" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">clean, facts intact</text>
<line x1="689" y1="113" x2="710" y2="113" stroke="#9198A1" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M614 156 C 614 214, 442 214, 442 158" fill="none" stroke="#8B93FF" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="528.0" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8B93FF" text-anchor="middle">not yet: the report goes back to the model</text>
<text x="32" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198A1" text-anchor="start">A pass ships only when the score is clean, every number, link, code span and citation</text>
<text x="32" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198A1" text-anchor="start">survived, and a configured detector clears. Two passes without progress stop the loop.</text>
</svg>
